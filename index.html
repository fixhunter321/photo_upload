<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Cloud — Kode Akses</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9f81f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Cloud">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--ink:#FFFFFF;
--ink-soft:rgba(255,255,255,0.72);
--ink-faint:rgba(255,255,255,0.5);
--glass:rgba(255,255,255,0.5);
--frame:#FFFFFF;
--accent:#FF8B6B;
}

*{ box-sizing:border-box; }

html,body{
margin:0;
padding:0;
min-height:100vh;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:linear-gradient(180deg,#e1e4eb 0%,#b0b5e4 55%,#a091f5 100%);
color:var(--ink);
}

.card{
width:100%;
max-width:440px;
background:var(--glass);
backdrop-filter:blur(20px) saturate(160%);
-webkit-backdrop-filter:blur(20px) saturate(160%);
border:1px solid var(--frame);
border-radius:28px;
padding:44px 36px 32px;
text-align:center;
box-shadow:0 20px 50px rgba(6,16,40,0.35);
animation:rise 0.6s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes rise{
from{
opacity:0;
transform:translateY(14px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

@media (prefers-reduced-motion: reduce){
.card{ animation:none; }
}

.badge{
width:60px;
height:60px;
margin:0 auto 20px;
border-radius:16px;
background:linear-gradient(145deg,var(--accent),#FF6F9C);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 22px rgba(255,110,110,0.35);
}

.badge svg{
width:28px;
height:28px;
}

h1{
font-family:'Fraunces',serif;
font-weight:600;
font-size:26px;
letter-spacing:-0.01em;
margin:0 0 6px;
color:var(--ink);
}

.subtitle{
font-size:14px;
color:var(--ink-soft);
margin:0 0 28px;
}

.field{
text-align:left;
margin-bottom:16px;
}

.field input{
width:100%;
background:rgba(255,255,255,0.14);
border:1px solid rgba(255,255,255,0.55);
border-radius:14px;
padding:14px 16px;
font-family:'Inter',sans-serif;
font-size:15px;
letter-spacing:0.03em;
color:var(--ink);
outline:none;
transition:border-color 0.15s ease, background 0.15s ease;
}

.field input::placeholder{
color:var(--ink-faint);
letter-spacing:0.01em;
}

.field input:focus{
background:rgba(255,255,255,0.22);
border-color:#FFFFFF;
}

.submit-btn{
width:100%;
background:linear-gradient(145deg,var(--accent),#FF6F9C);
border:none;
border-radius:14px;
padding:14px 18px;
font-family:'Inter',sans-serif;
font-size:15px;
font-weight:600;
color:#FFFFFF;
cursor:pointer;
box-shadow:0 10px 24px rgba(255,110,110,0.32);
transition:transform 0.15s ease, box-shadow 0.15s ease;
}

.submit-btn:hover{
transform:translateY(-1px);
box-shadow:0 14px 30px rgba(255,110,110,0.4);
}

.submit-btn:active{
transform:translateY(0);
}

.submit-btn:disabled{
opacity:0.6;
cursor:not-allowed;
transform:none !important;
}

.footnote{
margin:20px 0 0;
font-size:12.5px;
line-height:1.5;
color:var(--ink-faint);
}

.error{
margin:12px 0 0;
font-size:13px;
color:#FFE0E0;
display:none;
}

@media (max-width:420px){
.card{
padding:34px 24px 26px;
border-radius:24px;
}
h1{
font-size:23px;
}
}
</style>
</head>

<body>

<div class="card">

<div class="badge">
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M9 3.5L7.6 5.5H4.5C3.67 5.5 3 6.17 3 7V17C3 17.83 3.67 18.5 4.5 18.5H19.5C20.33 18.5 21 17.83 21 17V7C21 6.17 20.33 5.5 19.5 5.5H16.4L15 3.5H9Z"
stroke="white"
stroke-width="1.6"
stroke-linejoin="round"/>
<circle cx="12" cy="12" r="4"
stroke="white"
stroke-width="1.6"/>
</svg>
</div>

<h1>Photo Cloud</h1>

<p class="subtitle">
Upload foto ke cloud
</p>

<div class="field">
<input
type="password"
id="access-code"
placeholder="Masukkan kode akses"
autocomplete="off"
>
</div>

<button
class="submit-btn"
id="login-btn"
>
Masuk
</button>

<p
class="error"
id="login-status"
></p>

<p class="footnote">
Kode hanya untuk pengguna yang diizinkan
</p>

</div>

<script>

// Ganti dengan URL Apps Script /exec kamu (sama seperti di foto.html)
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwYCbQEe1rP08AZgYlOhBFFkkzZqN1gD7IUvANJFQgRSK5JrZyfW4k3yx54lFaoToVD/exec";

const loginBtn = document.getElementById("login-btn");
const accessCode = document.getElementById("access-code");
const loginStatus = document.getElementById("login-status");

async function checkAccess() {

  const code = accessCode.value;

  if (!code) {
    loginStatus.textContent = "Kode akses tidak boleh kosong.";
    loginStatus.style.display = "block";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Memeriksa...";
  loginStatus.style.display = "none";

  try {

    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "checkAccess",
        code: code
      })
    });

    const result = await response.json();

    if (result.success) {

      // Simpan token sesi sementara (bukan password) supaya foto.html
      // tahu request ini sudah lolos verifikasi
      sessionStorage.setItem("accessGranted", "true");

      window.location.href = "foto.html";

    } else {

      loginStatus.textContent = "Kode akses salah!";
      loginStatus.style.display = "block";

    }

  } catch (error) {

    console.error(error);
    loginStatus.textContent = "Terjadi kesalahan, coba lagi.";
    loginStatus.style.display = "block";

  }

  loginBtn.disabled = false;
  loginBtn.textContent = "Masuk";

}

loginBtn.addEventListener("click", checkAccess);

accessCode.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    checkAccess();
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
