<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Cloud — Upload</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9f81f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Cloud">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#FFFFFF;
    --ink-soft:rgba(255,255,255,0.72);
    --ink-faint:rgba(255,255,255,0.5);
    --glass:rgba(255,255,255,0.5);
    --frame:#FFFFFF;
    --accent:#FF8B6B;
    --ok:#4ADE80;
    --wait:#FFC65C;
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;

    background:linear-gradient(
      180deg,
      #160e53,
      #9f81f3
    );

    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:460px;

    background:var(--glass);

    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);

    border:1px solid var(--frame);
    border-radius:26px;

    overflow:hidden;

    box-shadow:
      0 20px 50px rgba(10,15,40,0.35);

    animation:rise 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{
      opacity:0;
      transform:translateY(14px) scale(.98);
    }

    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .card{
      animation:none;
    }
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 22px;

    border-bottom:
      1px solid rgba(255,255,255,0.18);
  }

  .topbar span{
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
  }

  .dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:var(--ok);

    box-shadow:
      0 0 0 4px rgba(74,222,128,0.22);
  }

  .content{
    padding:28px 26px 26px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    letter-spacing:-0.01em;

    margin:0 0 20px;

    text-align:center;
  }

  .dropzone{
    border:
      1.5px dashed rgba(255,255,255,0.45);

    border-radius:20px;

    background:
      rgba(255,255,255,0.08);

    padding:34px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:10px;

    text-align:center;

    cursor:pointer;

    transition:
      background 0.15s ease,
      border-color 0.15s ease;
  }

  .dropzone:hover{
    background:
      rgba(255,255,255,0.14);

    border-color:
      rgba(255,255,255,0.7);
  }

  .dropzone svg{
    width:34px;
    height:34px;

    opacity:0.85;
  }

  .dropzone .label{
    font-size:14.5px;
    font-weight:500;

    color:var(--ink-soft);

    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .upload-btn{
    width:100%;

    margin-top:20px;

    background:
      linear-gradient(
        145deg,
        var(--accent),
        #FF6F9C
      );

    border:none;
    border-radius:14px;

    padding:14px 18px;

    font-family:'Inter',sans-serif;

    font-size:15px;
    font-weight:600;

    color:#FFFFFF;

    cursor:pointer;

    box-shadow:
      0 10px 24px rgba(255,110,110,0.32);

    transition:
      transform 0.15s ease,
      box-shadow 0.15s ease;
  }

  .upload-btn:hover{
    transform:translateY(-1px);

    box-shadow:
      0 14px 30px rgba(255,110,110,0.4);
  }

  .upload-btn:active{
    transform:translateY(0);
  }

  .upload-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none !important;
  }

  .meta{
    margin:20px 0 0;

    text-align:center;

    font-size:12.5px;
    line-height:1.7;

    color:var(--ink-faint);
  }

  .status-chip{
    margin:16px auto 0;

    width:fit-content;

    display:flex;
    align-items:center;

    gap:8px;

    background:
      rgba(255,255,255,0.12);

    border:
      1px solid rgba(255,255,255,0.2);

    border-radius:999px;

    padding:7px 14px;

    font-size:12.5px;

    color:var(--ink-soft);
  }

  .status-chip .dot{
    background:var(--wait);

    box-shadow:
      0 0 0 4px rgba(255,198,92,0.22);

    transition:
      background 0.2s ease,
      box-shadow 0.2s ease;
  }

  .status-chip .dot.busy{
    background:#7FB2FF;

    box-shadow:
      0 0 0 4px rgba(127,178,255,0.22);

    animation:pulse 1s ease-in-out infinite;
  }

  .status-chip .dot.ok{
    background:var(--ok);

    box-shadow:
      0 0 0 4px rgba(74,222,128,0.22);
  }

  .status-chip .dot.fail{
    background:#FF6B6B;

    box-shadow:
      0 0 0 4px rgba(255,107,107,0.22);
  }

  @keyframes pulse{
    0%,100%{
      opacity:1;
    }

    50%{
      opacity:0.4;
    }
  }

  .dropzone.filled{
    border-style:solid;

    border-color:
      rgba(255,255,255,0.75);

    background:
      rgba(255,255,255,0.14);
  }

  .dz-warning{
    margin:10px 0 0;

    font-size:12px;

    color:#FFB4B4;

    text-align:center;

    display:none;
  }

  @media (max-width:420px){

    .content{
      padding:24px 20px 22px;
    }

    .topbar{
      padding:16px 18px;
    }

    h1{
      font-size:19px;
    }

    .dropzone{
      padding:28px 16px;
    }
  }
</style>
</head>

<body>

<div class="card">

  <div class="topbar">

    <span>
      Photo Cloud
    </span>

    <div class="dot"></div>

  </div>


  <div class="content">

    <h1>
      Upload foto
    </h1>


    <div
      class="dropzone"
      id="dropzone"
    >

      <svg
        id="dzIcon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M9 3.5L7.6 5.5H4.5C3.67 5.5 3 6.17 3 7V17C3 17.83 3.67 18.5 4.5 18.5H19.5C20.33 18.5 21 17.83 21 17V7C21 6.17 20.33 5.5 19.5 5.5H16.4L15 3.5H9Z"
          stroke="white"
          stroke-width="1.5"
          stroke-linejoin="round"
        />

        <circle
          cx="12"
          cy="12"
          r="3.6"
          stroke="white"
          stroke-width="1.5"
        />

      </svg>


      <span
        class="label"
        id="dzLabel"
      >
        Pilih foto
      </span>


      <input
        type="file"
        id="fileInput"
        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
        hidden
      >

    </div>


    <p
      class="dz-warning"
      id="dzWarning"
    ></p>


    <button
      class="upload-btn"
      id="uploadBtn"
    >
      Upload Foto
    </button>


    <p class="meta">
      Format: JPG, PNG<br>
      Maksimal: 5 MB
    </p>


    <div class="status-chip">

      <div
        class="dot"
        id="statusDot"
      ></div>

      <span id="statusText">
        Status: Menunggu upload
      </span>

    </div>

  </div>

</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwYCbQEe1rP08AZgYlOhBFFkkzZqN1gD7IUvANJFQgRSK5JrZyfW4k3yx54lFaoToVD/exec";


const dropzone =
document.getElementById("dropzone");

const fileInput =
document.getElementById("fileInput");

const dzLabel =
document.getElementById("dzLabel");

const dzWarning =
document.getElementById("dzWarning");

const uploadBtn =
document.getElementById("uploadBtn");

const statusDot =
document.getElementById("statusDot");

const statusText =
document.getElementById("statusText");


let selectedFile = null;


// ============================
// PILIH FOTO
// ============================

dropzone.addEventListener("click", () => {

  fileInput.click();

});


fileInput.addEventListener("change", () => {

  const file = fileInput.files[0];

  if (!file) {
    return;
  }


  // Cek format

  const allowedTypes = [
    "image/jpeg",
    "image/png"
  ];


  if (!allowedTypes.includes(file.type)) {

    selectedFile = null;

    dzWarning.textContent =
      "Format harus JPG atau PNG.";

    dzWarning.style.display =
      "block";

    return;
  }


  // Cek ukuran 5 MB

  if (file.size > 5 * 1024 * 1024) {

    selectedFile = null;

    dzWarning.textContent =
      "Ukuran foto maksimal 5 MB.";

    dzWarning.style.display =
      "block";

    return;
  }


  // Foto valid

  selectedFile = file;

  dzWarning.style.display =
    "none";

  dropzone.classList.add("filled");

  dzLabel.textContent =
    file.name;

  statusText.textContent =
    "Status: Foto siap diupload";

  statusDot.classList.remove(
    "busy",
    "ok",
    "fail"
  );

});


// ============================
// UPLOAD FOTO
// ============================

uploadBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {

      statusText.textContent =
        "Status: Pilih foto dulu.";

      statusDot.classList.remove(
        "busy",
        "ok"
      );

      statusDot.classList.add(
        "fail"
      );

      return;
    }


    // Loading

    uploadBtn.disabled = true;

    statusText.textContent =
      "Status: Mengupload...";

    statusDot.classList.remove(
      "ok",
      "fail"
    );

    statusDot.classList.add(
      "busy"
    );


    const reader =
      new FileReader();


    reader.onload =
      async () => {

        const base64 =
          reader.result.split(",")[1];


        try {

          const response =
            await fetch(
              SCRIPT_URL,
              {
                method:"POST",

                body:JSON.stringify({

                  file:base64,

                  fileName:
                    selectedFile.name,

                  mimeType:
                    selectedFile.type

                })
              }
            );


          const result =
            await response.json();


          if (result.success) {

            statusText.textContent =
              "Status: Foto berhasil diupload ✓";

            statusDot.classList.remove(
              "busy",
              "fail"
            );

            statusDot.classList.add(
              "ok"
            );


            selectedFile = null;

            fileInput.value = "";

            dzLabel.textContent =
              "Pilih foto";

            dropzone.classList.remove(
              "filled"
            );


          } else {

            statusText.textContent =
              "Status: Upload gagal.";

            statusDot.classList.remove(
              "busy",
              "ok"
            );

            statusDot.classList.add(
              "fail"
            );

            console.error(
              result.error
            );

          }


        } catch (error) {

          console.error(error);

          statusText.textContent =
            "Status: Terjadi kesalahan.";

          statusDot.classList.remove(
            "busy",
            "ok"
          );

          statusDot.classList.add(
            "fail"
          );

        }


        uploadBtn.disabled =
          false;

      };


    reader.readAsDataURL(
      selectedFile
    );

  }
);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
